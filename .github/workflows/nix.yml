name: nix

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Informational: a failing Nix build does not fail the check.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31

    - name: Build
      run: nix build -L

    - name: Check flake
      run: nix flake check

    - name: Smoke test
      run: ./result/bin/rdma_gen --help 2>&1 | grep -- '-op_type'
