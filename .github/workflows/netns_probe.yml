# Trial invocation for the namespace probe. Runs the exported script
# directly; the probe needs no build, so this job does not wait for one. Kept
# separate from the generated getdeps workflow.

name: netns-probe

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Ensure iproute2 and iputils-ping
        run: |
          command -v ip && command -v ping || {
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iproute2 iputils-ping
          }

      - name: Run privileged namespace probe
        run: python3 libsoftmetaroce/test/netns/netns_probe.py --mode=privileged
